<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LUDO QAR</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-2: #3b82f6;
      --danger: #ef4444;
      --gold: #f59e0b;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 14px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .badge {
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
      white-space: nowrap;
      font-weight: 600;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      min-width: 140px;
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-2);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: var(--accent-2);
      transition: transform 0.08s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    button.green {
      background: var(--accent);
      color: #052e16;
    }

    button.gold {
      background: var(--gold);
      color: #1c1917;
    }

    button.secondary {
      background: #334155;
    }

    .room-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .room-code {
      font-weight: 800;
      font-size: 15px;
      color: #fde047;
    }

    .players {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .player {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
    }

    .player.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.35);
    }

    .board-box {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .dice-box {
      width: 78px;
      height: 78px;
      margin: 0 auto 12px;
      border-radius: 18px;
      background: #fff;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 900;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .tracks {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .track {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 6px;
      font-size: 12px;
    }

    .pos {
      font-size: 20px;
      font-weight: 800;
      margin-top: 4px;
      color: #38bdf8;
    }

    .chat-list {
      max-height: 150px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
    }

    .msg-sender {
      font-weight: 700;
      color: #93c5fd;
      margin-right: 6px;
    }

    .status-note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <div class="title">🎲 LUDO QAR</div>
        <div class="sub" id="userInfo">O'yinchi yuklanmoqda...</div>
      </div>
      <div class="badge" id="modeBadge">Lokal / Tayyor</div>
    </div>

    <div class="card">
      <div class="room-bar">
        <div>Xona: <span class="room-code" id="roomCode">RANDOM</span></div>
        <div class="sub" id="turnInfo">Navbat: 1-o'yinchi</div>
      </div>
      <div class="row">
        <button class="green" id="createRoomBtn">+ Yangi xona</button>
        <input type="text" id="roomInput" placeholder="Xona kodi (masalan: QAR-1234)" maxlength="16" />
        <button id="joinRoomBtn">Kirish</button>
      </div>
      <div class="status-note" id="apiHint">GitHub Pages rejimida ishlayapti (API ulansa avtomatik sinxronlanadi).</div>
    </div>

    <div class="card">
      <div class="players" id="playersBox"></div>
      <div class="board-box">
        <div class="dice-box" id="diceValue">🎲</div>
        <div class="row" style="justify-content: center;">
          <button class="gold" id="rollBtn">Zar tashlash</button>
          <button class="secondary" id="moveBtn">Yurish / Navbat</button>
        </div>
        <div class="tracks" id="tracksBox"></div>
      </div>
    </div>

    <div class="card">
      <div class="chat-list" id="chatList"></div>
      <div class="row">
        <input type="text" id="chatInput" placeholder="Xabar yozing..." maxlength="90" />
        <button id="sendChatBtn">Yuborish</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Agar keyinroq o'z API serveringiz bo'lsa, shu yerga https://... manzilini yozishingiz mumkin
    const API_BASE = "";

    const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
    const currentUser = {
      id: tgUser ? String(tgUser.id) : localStorage.getItem("ludo_qar_uid") || ("u_" + Math.random().toString(36).slice(2, 8)),
      name: tgUser
        ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ") || tgUser.username || "O'yinchi"
        : localStorage.getItem("ludo_qar_name") || "Mehmon QAR"
    };
    localStorage.setItem("ludo_qar_uid", currentUser.id);
    localStorage.setItem("ludo_qar_name", currentUser.name);

    const colors = ["🔴 Qizil", "🟢 Yashil", "🔵 Ko'k", "🟡 Sariq"];

    let state = {
      code: "RANDOM",
      players: [
        { id: currentUser.id, name: currentUser.name, pos: 0 },
        { id: "bot_1", name: "Qareken Bot 1", pos: 0 },
        { id: "bot_2", name: "Qareken Bot 2", pos: 0 },
        { id: "bot_3", name: "Qareken Bot 3", pos: 0 }
      ],
      turn: 0,
      dice: 0,
      phase: "ROLL",
      chat: [{ sender: "LUDO QAR", text: "Xush kelibsiz! Zar tashlab o'yinni boshlang." }]
    };

    function render() {
      document.getElementById("userInfo").textContent = `${currentUser.name} (ID: ${currentUser.id})`;
      document.getElementById("roomCode").textContent = state.code;

      const activePlayer = state.players[state.turn] || state.players[0];
      document.getElementById("turnInfo").textContent = `Navbat: ${activePlayer ? activePlayer.name : "-"} (${state.phase})`;

      document.getElementById("diceValue").textContent = state.dice > 0 ? state.dice : "🎲";

      const playersBox = document.getElementById("playersBox");
      playersBox.innerHTML = "";
      state.players.slice(0, 4).forEach((p, idx) => {
        const div = document.createElement("div");
        div.className = "player" + (idx === state.turn ? " active" : "");
        div.innerHTML = `<div><strong>${colors[idx] || "🎲"}</strong></div><div>${escapeHtml(p.name)}</div><div class="sub">Katak: ${p.pos || 0} / 56</div>`;
        playersBox.appendChild(div);
      });

      const tracksBox = document.getElementById("tracksBox");
      tracksBox.innerHTML = "";
      state.players.slice(0, 4).forEach((p, idx) => {
        const div = document.createElement("div");
        div.className = "track";
        div.innerHTML = `<div>${(colors[idx] || "P").split(" ")[0]} ${escapeHtml(p.name.split(" ")[0])}</div><div class="pos">${p.pos || 0}</div>`;
        tracksBox.appendChild(div);
      });

      const chatList = document.getElementById("chatList");
      chatList.innerHTML = "";
      state.chat.forEach((m) => {
        const line = document.createElement("div");
        line.innerHTML = `<span class="msg-sender">${escapeHtml(m.sender)}:</span><span>${escapeHtml(m.text)}</span>`;
        chatList.appendChild(line);
      });
      chatList.scrollTop = chatList.scrollHeight;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function apiCall(path, method = "GET", body = null) {
      if (!API_BASE) return null;
      try {
        const opts = { method, headers: { "Content-Type": "application/json" } };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(API_BASE + path, opts);
        if (!res.ok) return null;
        return await res.json();
      } catch (_) {
        return null;
      }
    }

    async function createRoom() {
      const code = "QAR-" + Math.floor(1000 + Math.random() * 9000);
      const data = await apiCall("/api/room/create", "POST", { user: currentUser, code });
      if (data && data.room) {
        state = { ...state, ...data.room };
      } else {
        state.code = code;
        state.players[0] = { ...state.players[0], id: currentUser.id, name: currentUser.name };
        state.turn = 0;
        state.dice = 0;
        state.phase = "ROLL";
        state.chat.push({ sender: "Tizim", text: `${code} xonasi yaratildi.` });
      }
      render();
    }

    async function joinRoom() {
      const input = document.getElementById("roomInput");
      const code = (input.value.trim() || "RANDOM").toUpperCase();
      const data = await apiCall("/api/room/join", "POST", { user: currentUser, code });
      if (data && data.room) {
        state = { ...state, ...data.room };
      } else {
        state.code = code;
        state.players[0] = { ...state.players[0], id: currentUser.id, name: currentUser.name };
        state.chat.push({ sender: "Tizim", text: `${currentUser.name} ${code} xonasiga kirdi.` });
      }
      render();
    }

    async function rollDice() {
      const data = await apiCall("/api/game/roll", "POST", { code: state.code, user: currentUser });
      if (data && typeof data.dice === "number") {
        state.dice = data.dice;
        state.phase = data.room ? data.room.phase : "MOVE";
      } else {
        state.dice = Math.floor(1 + Math.random() * 6);
        state.phase = "MOVE";
      }
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred("medium");
      }
      render();
    }

    async function movePiece() {
      if (state.dice <= 0) {
        state.chat.push({ sender: "Tizim", text: "Avval zar tashlang!" });
        render();
        return;
      }
      const data = await apiCall("/api/game/move", "POST", { code: state.code, user: currentUser, dice: state.dice });
      if (data && data.room) {
        state = { ...state, ...data.room };
      } else {
        const p = state.players[state.turn];
        if (p) {
          p.pos = Math.min(56, (p.pos || 0) + state.dice);
        }
        if (state.dice !== 6) {
          state.turn = (state.turn + 1) % state.players.length;
        }
        state.phase = "ROLL";
      }
      render();
    }

    async function sendChat() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";

      const data = await apiCall("/api/game/chat", "POST", {
        code: state.code,
        sender: currentUser.name,
        text
      });
      if (data && Array.isArray(data.chat)) {
        state.chat = data.chat;
      } else {
        state.chat.push({ sender: currentUser.name, text });
        state.chat = state.chat.slice(-30);
      }
      render();
    }

    document.getElementById("createRoomBtn").addEventListener("click", createRoom);
    document.getElementById("joinRoomBtn").addEventListener("click", joinRoom);
    document.getElementById("rollBtn").addEventListener("click", rollDice);
    document.getElementById("moveBtn").addEventListener("click", movePiece);
    document.getElementById("sendChatBtn").addEventListener("click", sendChat);
    document.getElementById("chatInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendChat();
    });

    if (API_BASE) {
      document.getElementById("modeBadge").textContent = "Onlayn API";
      document.getElementById("apiHint").textContent = `Serverga ulangan: ${API_BASE}`;
    }

    render();
  </script>
</body>
      </html>
