mkdir -p ~/ludo_qar && cat <<'EOF' > ~/ludo_qar/index.html
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>LUDO QAR</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #070b14;
    --card: rgba(17, 24, 39, 0.86);
    --ink: #f8fafc;
    --muted: #94a3b8;
    --accent: #e11d48;
    --accent-dark: #be123c;
    --green: #22c55e;
    --line: rgba(148, 163, 184, 0.2);
    --arena-bg: rgba(9, 14, 24, 0.92);
    --arena-panel: rgba(20, 29, 46, 0.95);
    --red-c: #ef4444;
    --green-c: #22c55e;
    --yellow-c: #facc15;
    --blue-c: #3b82f6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .ios-emo {
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }

  .splash-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: radial-gradient(circle at 50% 28%, #1e3a8a 0%, #091120 68%, #04070e 100%);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 14px;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }
  .splash-screen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .splash-video-stage {
    width: 100%;
    max-width: 340px;
    aspect-ratio: 1 / 1;
    border-radius: 26px;
    position: relative;
    overflow: hidden;
    border: 2px solid rgba(56, 189, 248, 0.5);
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.65), 0 0 28px rgba(34, 197, 94, 0.25);
    background: radial-gradient(circle at 50% 40%, #1d4ed8, #0f172a 75%);
    display: grid;
    place-items: center;
  }
  .splash-motion-bg {
    position: absolute;
    inset: -35%;
    background: conic-gradient(from 0deg, rgba(239,68,68,0.25), rgba(34,197,94,0.25), rgba(59,130,246,0.28), rgba(250,204,21,0.25), rgba(239,68,68,0.25));
    animation: spinGlow 7s linear infinite;
    filter: blur(18px);
    z-index: 0;
  }
  @keyframes spinGlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .splash-core {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .splash-3d-dice {
    font-size: 62px;
    filter: drop-shadow(0 10px 16px rgba(0,0,0,0.55));
    animation: splashDiceSpin 1.3s ease-in-out infinite;
  }
  @keyframes splashDiceSpin {
    0% { transform: rotateY(0deg) rotateZ(0deg) scale(1); }
    50% { transform: rotateY(180deg) rotateZ(12deg) scale(1.14); }
    100% { transform: rotateY(360deg) rotateZ(0deg) scale(1); }
  }
  .splash-pawns { display: flex; gap: 10px; font-size: 24px; }
  .splash-pawns span { animation: pawnBounce 0.9s ease-in-out infinite alternate; }
  .splash-pawns span:nth-child(2) { animation-delay: 0.15s; }
  .splash-pawns span:nth-child(3) { animation-delay: 0.3s; }
  .splash-pawns span:nth-child(4) { animation-delay: 0.45s; }
  @keyframes pawnBounce {
    from { transform: translateY(0px); }
    to { transform: translateY(-9px); }
  }
  .splash-brand {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 1.5px;
    color: #fde047;
    text-shadow: 0 4px 14px rgba(0,0,0,0.65);
  }
  .splash-bar-wrap {
    width: 100%;
    max-width: 300px;
    height: 8px;
    background: rgba(255,255,255,0.16);
    border-radius: 999px;
    overflow: hidden;
  }
  .splash-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ef4444, #facc15, #22c55e, #38bdf8);
    border-radius: 999px;
    transition: width 0.12s linear;
  }
  .splash-pct { font-size: 12px; font-weight: 800; color: #cbd5e1; }
  .splash-actions { display: flex; gap: 8px; margin-top: 2px; }
  .splash-mini-btn {
    border: 1px solid rgba(255,255,255,0.28);
    background: rgba(15,23,42,0.72);
    color: #f8fafc;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
  }

  .qr-flag-bg {
    position: fixed;
    inset: -12px;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    opacity: 0.22;
    filter: blur(4px) saturate(1.1);
  }
  .qr-stripe-green {
    position: absolute; top: 0; bottom: 0; left: 0; width: 32%;
    background: linear-gradient(180deg, #16a34a, #059669);
  }
  .qr-stripe-yellow {
    position: absolute; top: 0; bottom: 0; left: 33.5%; width: 33%;
    background: linear-gradient(180deg, #eab308, #ca8a04);
  }
  .qr-stripe-blue {
    position: absolute; top: 0; bottom: 0; left: 68%; width: 32%;
    background: linear-gradient(180deg, #0284c7, #0369a1);
  }
  .qr-line-red-l {
    position: absolute; top: 0; bottom: 0; left: 32%; width: 1.5%;
    background: #dc2626;
  }
  .qr-line-red-r {
    position: absolute; top: 0; bottom: 0; left: 66.5%; width: 1.5%;
    background: #dc2626;
  }
  .qr-dark-scrim {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(circle at 50% 20%, rgba(15, 23, 42, 0.45), rgba(4, 7, 15, 0.82));
  }

  .app {
    width: 100%; max-width: 460px; height: 100dvh; margin: 0 auto;
    display: flex; flex-direction: column; position: relative; z-index: 1;
  }
  .topbar {
    background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px);
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;
  }
  .user-mini { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .ava-circle {
    width: 38px; height: 38px; border-radius: 50%; background: #1e293b;
    display: grid; place-items: center; font-size: 19px; flex-shrink: 0; border: 1.5px solid #475569;
  }
  .handle-txt { font-size: 11px; color: var(--muted); font-weight: 600; }
  .name-txt { font-size: 14px; font-weight: 900; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-badge {
    background: rgba(250, 204, 21, 0.14); color: #fde047; border: 1px solid rgba(250, 204, 21, 0.35);
    border-radius: 10px; padding: 5px 10px; font-size: 12px; font-weight: 800;
  }
  .content {
    flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 86px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .tab-view { display: none; flex-direction: column; gap: 12px; }
  .tab-view.active { display: flex; }
  .card {
    background: var(--card); backdrop-filter: blur(10px); border-radius: 18px; padding: 14px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); border: 1px solid var(--line);
  }
  .bal-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .bal-label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .bal-val { font-size: 26px; font-weight: 900; color: var(--ink); margin-top: 2px; }
  .pill-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 999px;
    padding: 10px 16px; font-size: 13px; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 12px rgba(225, 29, 72, 0.35);
  }
  .pill-btn:active { transform: scale(0.98); background: var(--accent-dark); }
  .sec-title { font-size: 15px; font-weight: 800; color: var(--ink); margin: 2px 0 0; }
  .mode-stack { display: flex; flex-direction: column; gap: 10px; }
  .action-card {
    background: var(--card); backdrop-filter: blur(10px); border-radius: 16px; padding: 14px; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.32);
  }
  .action-title { font-size: 14px; font-weight: 800; color: var(--ink); }
  .action-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .buy-btn {
    background: #1e293b; color: #f8fafc; border: 1px solid rgba(148, 163, 184, 0.3); border-radius: 10px;
    padding: 8px 12px; font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap;
  }
  .buy-btn:active { background: #334155; }
  .code-inp {
    flex: 1; border: 1.5px solid #334155; border-radius: 12px; padding: 9px 11px;
    font-size: 13px; font-weight: 700; outline: none; background: #0f172a; color: #f8fafc;
  }
  .soft-btn {
    border: 1px solid var(--line); background: #1e293b; color: #f8fafc;
    border-radius: 12px; padding: 8px 10px; font-size: 12px; font-weight: 800; cursor: pointer;
  }
  .lang-box { display: flex; background: #0f172a; border-radius: 10px; padding: 2px; border: 1px solid var(--line); }
  .lang-btn { border: none; background: transparent; color: var(--muted); font-size: 12px; font-weight: 800; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .lang-btn.active { background: var(--accent); color: #fff; }

  .kar-arena {
    background: var(--arena-bg); backdrop-filter: blur(10px);
    color: #f8fafc; border-radius: 20px; padding: 10px;
    display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 12px 28px rgba(2, 6, 23, 0.55);
    border: 1px solid rgba(148, 163, 184, 0.25);
  }
  .kar-top-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .kar-top-chip {
    background: var(--arena-panel); color: #f8fafc;
    border: 1px solid rgba(148, 163, 184, 0.28);
    border-radius: 12px; padding: 4px 11px; font-size: 11px; font-weight: 800;
  }
  .kar-pts-chip {
    background: rgba(250, 204, 21, 0.16); color: #fde047;
    border: 1px solid rgba(250, 204, 21, 0.45);
    border-radius: 12px; padding: 4px 10px; font-size: 11px; font-weight: 800;
  }

  .players-4-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .p4-card {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    background: var(--arena-panel); border: 1.5px solid rgba(148, 163, 184, 0.22);
    border-radius: 13px; padding: 5px 7px; min-width: 0;
    transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
  }
  .p4-card.active-r { border-color: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.45); transform: scale(1.02); }
  .p4-card.active-g { border-color: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.45); transform: scale(1.02); }
  .p4-card.active-b { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.45); transform: scale(1.02); }
  .p4-card.active-y { border-color: #facc15; box-shadow: 0 0 10px rgba(250, 204, 21, 0.45); transform: scale(1.02); }

  .p4-left { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
  .p4-ava {
    width: 28px; height: 28px; border-radius: 9px;
    background: #334155; display: grid; place-items: center; font-size: 15px; flex-shrink: 0;
  }
  .p4-name {
    font-size: 11px; font-weight: 800; color: #f8fafc;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .p4-segs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.5px; margin-top: 3px; }
  .p4-segs span { height: 3px; border-radius: 999px; background: rgba(148, 163, 184, 0.35); }
  .p4-segs.r span.on { background: #ef4444; }
  .p4-segs.g span.on { background: #22c55e; }
  .p4-segs.b span.on { background: #3b82f6; }
  .p4-segs.y span.on { background: #facc15; }

  .dice-3d-stage { width: 38px; height: 38px; perspective: 240px; flex-shrink: 0; cursor: pointer; }
  .kar-dice {
    width: 100%; height: 100%; border-radius: 10px;
    background: linear-gradient(145deg, #ffffff, #e2e8f0);
    color: #0f172a; border: 2px solid #cbd5e1;
    display: grid; place-items: center; font-size: 22px; font-weight: 900;
    box-shadow: 0 4px 10px rgba(0,0,0,0.45), inset 0 -2px 4px rgba(15,23,42,0.18);
    transform-style: preserve-3d;
  }
  .kar-dice.ready {
    border-color: #facc15;
    box-shadow: 0 0 10px rgba(250, 204, 21, 0.65), 0 4px 10px rgba(0,0,0,0.45);
  }
  .kar-dice.spin3d {
    animation: dice3dRoll 0.34s linear infinite;
    border-color: #38bdf8;
  }
  @keyframes dice3dRoll {
    0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1.12); }
    33% { transform: rotateX(140deg) rotateY(190deg) rotateZ(90deg) scale(0.92); }
    66% { transform: rotateX(270deg) rotateY(300deg) rotateZ(210deg) scale(1.12); }
    100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg) scale(1.05); }
  }

  .kar-board-wrap {
    width: 100%; aspect-ratio: 1 / 1;
    background: #ffffff; border-radius: 12px; padding: 0;
    position: relative; overflow: hidden; border: 3px solid #e2e8f0;
    box-shadow: inset 0 0 0 1px rgba(15,23,42,0.18), 0 8px 20px rgba(0,0,0,0.35);
  }
  .kar-grid {
    width: 100%; height: 100%;
    display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr);
  }
  .kcell {
    border: 0.5px solid rgba(15, 23, 42, 0.16);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800; color: #0f172a;
  }
  .k-red { background: var(--red-c); border-color: rgba(255,255,255,0.22); }
  .k-green { background: var(--green-c); border-color: rgba(255,255,255,0.22); }
  .k-blue { background: var(--blue-c); border-color: rgba(255,255,255,0.22); }
  .k-yellow { background: var(--yellow-c); border-color: rgba(255,255,255,0.22); }

  .k-hred { background: #fca5a5; color: #7f1d1d; }
  .k-hgreen { background: #86efac; color: #14532d; }
  .k-hblue { background: #93c5fd; color: #1e3a8a; }
  .k-hyellow { background: #fde047; color: #713f12; }

  .k-star::after { content: "★"; font-size: 11px; color: #334155; }

  .k-yard {
    position: absolute; width: 25.4%; height: 25.4%;
    background: #ffffff; border-radius: 12px; z-index: 2; pointer-events: none;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    place-items: center; padding: 12%; gap: 14%;
    box-shadow: inset 0 2px 6px rgba(15,23,42,0.12);
  }
  .k-yard.tl { top: 7.3%; left: 7.3%; }
  .k-yard.tr { top: 7.3%; right: 7.3%; }
  .k-yard.bl { bottom: 7.3%; left: 7.3%; }
  .k-yard.br { bottom: 7.3%; right: 7.3%; }
  .k-ring {
    width: 100%; height: 100%; border-radius: 50%;
    border: 2.5px solid #cbd5e1; background: #f8fafc;
  }
  .k-yard.tl .k-ring { border-color: #f87171; }
  .k-yard.tr .k-ring { border-color: #4ade80; }
  .k-yard.bl .k-ring { border-color: #60a5fa; }
  .k-yard.br .k-ring { border-color: #facc15; }

  .k-center {
    position: absolute; left: 40%; top: 40%; width: 20%; height: 20%;
    z-index: 3; pointer-events: none;
    background: conic-gradient(from -45deg, var(--green-c) 0 90deg, var(--yellow-c) 90deg 180deg, var(--blue-c) 180deg 270deg, var(--red-c) 270deg 360deg);
    display: grid; place-items: center;
  }
  .k-center-badge {
    width: 52%; height: 52%; border-radius: 50%; background: #ffffff;
    display: grid; place-items: center; font-size: 13px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  .k-pin {
    position: absolute; width: 6.5%; height: 7.8%;
    transform: translate(-50%, -68%); z-index: 6; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: top 0.11s ease, left 0.11s ease, transform 0.12s ease;
  }
  .k-pin svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.48)); }
  .k-pin.can { z-index: 9; animation: pinPulse 0.65s infinite alternate; }
  @keyframes pinPulse {
    from { transform: translate(-50%, -70%) scale(1.04); filter: drop-shadow(0 0 4px #fde047); }
    to { transform: translate(-50%, -82%) scale(1.18); filter: drop-shadow(0 0 9px #facc15); }
  }

  .chat-box {
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 14px; padding: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .chat-feed {
    max-height: 76px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px; font-size: 11px;
  }
  .chat-line { color: #e2e8f0; background: rgba(30, 41, 59, 0.85); padding: 4px 8px; border-radius: 8px; }
  .chat-line b { color: #fde047; }
  .chat-form { display: flex; gap: 6px; }
  .chat-inp {
    flex: 1; border: 1px solid rgba(148, 163, 184, 0.35); background: #0f172a;
    color: #f8fafc; border-radius: 10px; padding: 6px 9px; font-size: 12px; outline: none;
  }
  .chat-send {
    border: none; background: var(--accent); color: #fff; border-radius: 10px;
    padding: 6px 11px; font-size: 12px; font-weight: 800; cursor: pointer;
  }

  .kar-foot-btns { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .kar-round-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--arena-panel); color: #e2e8f0;
    border: 1px solid rgba(148, 163, 184, 0.25);
    display: grid; place-items: center; font-size: 15px; cursor: pointer; flex-shrink: 0;
  }

  .offer-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .offer-item:last-child { border-bottom: none; }
  .offer-title { font-size: 13px; font-weight: 800; color: var(--ink); }
  .offer-sub { font-size: 11px; color: var(--muted); }
  .hist-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12px;
  }
  .hist-item:last-child { border-bottom: none; }
  .pos { color: var(--green); font-weight: 800; }
  .neg { color: #fb7185; font-weight: 800; }

  .bottom-nav {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 24px); max-width: 436px;
    background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 20px; padding: 6px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; z-index: 20;
  }
  .nav-btn {
    border: none; background: transparent; color: var(--muted); border-radius: 14px;
    padding: 7px 4px; font-size: 11px; font-weight: 800; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .nav-btn.active { background: rgba(225, 29, 72, 0.18); color: #fda4af; }
</style>
</head>
<body>
  <div class="splash-screen" id="splashScreen">
    <div class="splash-video-stage">
      <div class="splash-motion-bg"></div>
      <div class="splash-core">
        <div class="splash-3d-dice ios-emo">🎲</div>
        <div class="splash-pawns ios-emo"><span>🔴</span><span>🟢</span><span>🔵</span><span>🟡</span></div>
        <div class="splash-brand">LUDO QAR</div>
      </div>
    </div>
    <div class="splash-bar-wrap"><div class="splash-bar-fill" id="splashBar"></div></div>
    <div class="splash-pct" id="splashPct">0%</div>
    <div class="splash-actions">
      <button class="splash-mini-btn" id="skipSplashBtn">O'tkazib yuborish</button>
    </div>
  </div>

  <div class="qr-flag-bg">
    <div class="qr-stripe-green"></div>
    <div class="qr-line-red-l"></div>
    <div class="qr-stripe-yellow"></div>
    <div class="qr-line-red-r"></div>
    <div class="qr-stripe-blue"></div>
  </div>
  <div class="qr-dark-scrim"></div>

  <div class="app">
    <div class="topbar">
      <div class="user-mini">
        <div class="ava-circle ios-emo" id="topAva">😎</div>
        <div>
          <div class="handle-txt" id="topHandle">@ludo_qar</div>
          <div class="name-txt" id="topName">O'yinchi</div>
        </div>
